<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Anonymous Group Debate - Professional Anonymous Group Debates</title>
  <meta name="description" content="Join meaningful anonymous debates on topics that matter. Share perspectives, engage with diverse viewpoints, and participate in constructive discussions.">
  <meta name="keywords" content="debate, discussion, anonymous, community, voting, opinions">
  <meta name="author" content="Anonymous Group Debate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Anonymous Group Debate - Professional Anonymous Group Debates">
  <meta property="og:description" content="Join meaningful anonymous debates on topics that matter.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://localhost:4201">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anonymous Group Debate - Professional Anonymous Group Debates">
  <meta name="twitter:description" content="Join meaningful anonymous debates on topics that matter.">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#3b82f6">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('app-theme-preference');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif;">
      <div style="text-align: center;">
        <div style="width: 50px; height: 50px; border: 3px solid var(--primary-color, #3b82f6); border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
        <h2 style="color: var(--heading-color, #1e293b); margin: 0;">Loading Anonymous Group Debate...</h2>
        <p style="color: var(--text-muted, #64748b); margin: 0.5rem 0 0;">Preparing your debate experience</p>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </app-root>
</body>
</html>
